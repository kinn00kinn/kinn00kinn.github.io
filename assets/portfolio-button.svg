<svg xmlns="http://www.w3.org/2000/svg" width="560" height="132" viewBox="0 0 560 132" role="img" aria-labelledby="title description">
  <title id="title">Open kinn-kinn.com</title>
  <desc id="description">A colorful button with an animated hand tapping the portfolio link.</desc>

  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#18181b" opacity="0.12"/>
    </pattern>
    <clipPath id="button-clip">
      <rect x="16" y="16" width="512" height="92" rx="16"/>
    </clipPath>
  </defs>

  <!-- Pop accents behind the button -->
  <path d="M18 4l3.5 7 7.5 1-5.5 5.5 1.5 7.5-7-3.5-7 3.5 1.5-7.5L7 12l7.5-1Z" fill="#fbbf24" stroke="#18181b" stroke-width="2"/>
  <circle cx="541" cy="29" r="9" fill="#fb7185" stroke="#18181b" stroke-width="2"/>
  <path d="M538 91l14 7-12 9" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Brutalist offset shadow and button surface -->
  <rect x="23" y="24" width="512" height="92" rx="16" fill="#18181b"/>
  <rect x="16" y="16" width="512" height="92" rx="16" fill="#6ee7b7" stroke="#18181b" stroke-width="3"/>
  <rect x="16" y="16" width="512" height="92" rx="16" fill="url(#dots)"/>

  <!-- Playful color blocks -->
  <g clip-path="url(#button-clip)">
    <path d="M16 89h155l-24 19H16Z" fill="#fbbf24"/>
    <path d="M367 16h65l-20 18h-65Z" fill="#38bdf8" opacity="0.9"/>
    <circle cx="427" cy="103" r="21" fill="#fb7185" opacity="0.9"/>
  </g>

  <!-- Status strip -->
  <rect x="38" y="31" width="118" height="22" rx="11" fill="#18181b"/>
  <circle cx="52" cy="42" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="63" y="46" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.3">ONLINE / OPEN</text>

  <!-- Main label -->
  <text x="38" y="81" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="27" font-weight="900" letter-spacing="-1.2">kinn-kinn.com</text>
  <rect x="244" y="60" width="4" height="25" rx="1" fill="#18181b">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Arrow target -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" keyTimes="0;0.45;1" dur="1.8s" repeatCount="indefinite"/>
    <rect x="448" y="34" width="58" height="58" rx="14" fill="#18181b"/>
    <path d="M465 63h22m-9-9 9 9-9 9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- TAP sticker -->
  <g transform="rotate(7 488 24)">
    <rect x="464" y="5" width="50" height="25" rx="7" fill="#fb7185" stroke="#18181b" stroke-width="2"/>
    <text x="489" y="22" text-anchor="middle" fill="#18181b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="900">TAP!</text>
  </g>

  <!-- Tap ripple -->
  <circle cx="487" cy="63" r="6" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0">
    <animate attributeName="r" values="6;6;24" keyTimes="0;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated tapping hand -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="8 10;0 0;0 0;8 10" keyTimes="0;0.34;0.52;1" dur="1.8s" repeatCount="indefinite"/>
    <path d="M476 122c-8-5-12-13-12-22V84c0-3 2-5 5-5 2 0 4 1 5 3V62c0-3 2-5 5-5s5 2 5 5v19-8c0-3 2-5 5-5s5 2 5 5v10-6c0-3 2-5 5-5s5 2 5 5v8-3c0-3 2-5 5-5s5 2 5 5v16c0 12-7 22-18 26l-5 2c-4 1-7 0-10-4Z" fill="#fde68a" stroke="#18181b" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M474 83v16M484 81v16M494 83v14M504 85v12" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" opacity="0.32"/>
    <path d="M474 120c10 3 21 2 30-4l5 10c-13 7-27 8-40 3Z" fill="#38bdf8" stroke="#18181b" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Tiny confetti -->
  <path d="M291 33l7-7M304 38h10M298 46l6 7" stroke="#18181b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="332" cy="77" r="5" fill="#fb7185" stroke="#18181b" stroke-width="2"/>
  <path d="M352 61l5 9 9-5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
